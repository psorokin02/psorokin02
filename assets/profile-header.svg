      <stop offset="1" stop-color="#7900F1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 58) rotate(126.5) scale(310 390)">
      <stop stop-color="#C081FF" stop-opacity="0.36"/>
