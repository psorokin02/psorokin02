      <stop stop-color="#100C15"/>
      <stop offset="0.52" stop-color="#28133B"/>
      <stop offset="1" stop-color="#7900F1"/>
    </linearGradient>
    <linearGradient id="accent" x1="58" y1="0" x2="320" y2="0" gradientUnits="userSpaceOnUse">
