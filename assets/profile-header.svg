  <g opacity="0.16" stroke="#E9D4FF">
    <path d="M880 28H1170"/><path d="M845 64H1170"/><path d="M940 100H1170"/>
    <path d="M900 136H1170"/><path d="M970 172H1170"/><path d="M870 208H1170"/><path d="M930 244H1170"/>
